server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The one saved plan. GET reads it (404 until the first save); PUT overwrites it.
    # nginx writes the upload to a temp file and renames it into place, so a failed
    # or interrupted save never leaves a half-written plan.json behind. Everything
    # else (including CORS preflight OPTIONS) is refused, so other websites open in
    # the same browser can't write to it.
    location = /api/plan {
        alias /data/plan.json;
        log_not_found off;  # a 404 here just means nothing has been saved yet
        limit_except GET PUT { deny all; }
        dav_methods PUT;
        dav_access user:rw group:rw;
        client_max_body_size 1m;
        default_type application/json;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # Hashed build output never changes under the same name — cache it hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new image is picked up on reload.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
